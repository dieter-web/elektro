name: elektro-linux
version: 0.1.0.0
author: dieter
license: BSD3
extra-source-files:
  - README.md

library:
  source-dirs: src/elektro-ghc
  exposed-modules:
    - Resistor
    - Dreiecksterntransformation
    - A45
    - A46
    - FrustumResistance

dependencies:
  - base >= 4.7 && < 5
  - aeson >= 2.0
  - bytestring >= 0.11

executables:
  elektro-exe:
    main: Main.hs
    source-dirs: src/elektro-ghc

